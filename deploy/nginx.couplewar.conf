# CoupleWar — Nginx reverse proxy pour couplewar.estim.pro (Hostinger VPS).
# - Termine le TLS (HTTPS obligatoire : PWA, Wake Lock, getUserMedia).
# - Sert le front statique buildé (client/dist).
# - Proxie /socket.io (WSS) et /healthz vers le service Node (port 3001).
#
# Installation :
#   sudo cp deploy/nginx.couplewar.conf /etc/nginx/sites-available/couplewar
#   sudo ln -s /etc/nginx/sites-available/couplewar /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d couplewar.estim.pro   # génère/branche le certificat

upstream couplewar_node {
    server 127.0.0.1:3001;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name couplewar.estim.pro;
    # Certbot ajoutera la redirection 301 vers HTTPS ici.
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name couplewar.estim.pro;

    # Certbot renseigne ssl_certificate / ssl_certificate_key (Let's Encrypt).
    # ssl_certificate     /etc/letsencrypt/live/couplewar.estim.pro/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/couplewar.estim.pro/privkey.pem;

    root /var/www/couplewar/client/dist;
    index index.html;

    # WebSocket persistant (WSS) — autorité temps réel.
    location /socket.io/ {
        proxy_pass http://couplewar_node;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;   # garde les sockets longue durée ouverts
        proxy_send_timeout 600s;
    }

    location /healthz {
        proxy_pass http://couplewar_node;
        proxy_set_header Host $host;
    }

    # PWA : service worker + manifest sans cache agressif.
    location = /sw.js { add_header Cache-Control "no-cache"; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache"; }

    # Assets fingerprintés : cache long.
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }

    # SPA fallback (offline shell servi par le SW).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
