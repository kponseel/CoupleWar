name: CI

on:
  # Sur push, on ne lance que pour main (évite le double-run push+PR sur les
  # branches de feature : les PR sont déjà couvertes par l'événement pull_request).
  push:
    branches: ["main"]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (shared + server + client)
        run: npm run typecheck

      - name: Unit tests (scoring)
        run: npm test

      - name: Build (shared + server + client PWA)
        run: npm run build

      - name: End-to-end (partie complète + reconnexion mid-round)
        run: |
          COUPLEWAR_CONFIG_PATH=config/game.config.fast.json PORT=3099 SERVE_STATIC=false \
            node server/dist/index.js > /tmp/cw-server.log 2>&1 &
          SRV=$!
          for i in $(seq 1 30); do curl -sf http://localhost:3099/healthz && break || sleep 0.5; done
          E2E_URL=http://localhost:3099 node server/test/e2e.mjs
          STATUS=$?
          kill $SRV 2>/dev/null || true
          exit $STATUS

      - name: End-to-end Wavelength (cible cachée, clue→reception→reveal)
        run: |
          COUPLEWAR_CONFIG_PATH=config/game.config.wave.json PORT=3098 SERVE_STATIC=false \
            node server/dist/index.js > /tmp/cw-wave.log 2>&1 &
          SRV=$!
          for i in $(seq 1 30); do curl -sf http://localhost:3098/healthz && break || sleep 0.5; done
          E2E_URL=http://localhost:3098 node server/test/e2e-wavelength.mjs
          STATUS=$?
          kill $SRV 2>/dev/null || true
          exit $STATUS

      - name: End-to-end Solo (1 couple, tous les modes)
        run: |
          COUPLEWAR_CONFIG_PATH=config/game.config.solo.json PORT=3097 SERVE_STATIC=false \
            node server/dist/index.js > /tmp/cw-solo.log 2>&1 &
          SRV=$!
          for i in $(seq 1 30); do curl -sf http://localhost:3097/healthz && break || sleep 0.5; done
          E2E_URL=http://localhost:3097 node server/test/e2e-solo.mjs
          STATUS=$?
          kill $SRV 2>/dev/null || true
          exit $STATUS

      - name: End-to-end Mime D3 (canal emojis, secret caché)
        run: |
          COUPLEWAR_CONFIG_PATH=config/game.config.mime.json PORT=3096 SERVE_STATIC=false \
            node server/dist/index.js > /tmp/cw-mime.log 2>&1 &
          SRV=$!
          for i in $(seq 1 30); do curl -sf http://localhost:3096/healthz && break || sleep 0.5; done
          E2E_URL=http://localhost:3096 node server/test/e2e-mime.mjs
          STATUS=$?
          kill $SRV 2>/dev/null || true
          exit $STATUS
