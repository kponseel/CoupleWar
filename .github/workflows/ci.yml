name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (shared + server + client)
        run: npm run typecheck

      - name: Unit tests (scoring)
        run: npm test

      - name: Build (shared + server + client PWA)
        run: npm run build

      - name: End-to-end (partie complète + reconnexion mid-round)
        run: |
          COUPLEWAR_CONFIG_PATH=config/game.config.fast.json PORT=3099 SERVE_STATIC=false \
            node server/dist/index.js > /tmp/cw-server.log 2>&1 &
          SRV=$!
          # Attend que le healthcheck réponde (max ~15s).
          for i in $(seq 1 30); do
            curl -sf http://localhost:3099/healthz && break || sleep 0.5
          done
          E2E_URL=http://localhost:3099 node server/test/e2e.mjs
          STATUS=$?
          kill $SRV 2>/dev/null || true
          exit $STATUS
